# Local-testing compose for the frontend only. The backend
# (../backend) deliberately doesn't containerize its own dependencies (see
# its CLAUDE.md) and has no Dockerfile of its own, so this doesn't invent one
# — run the backend however you normally do (`uvicorn main:app`, with your
# own Redis/Postgres) and point API_URL at it.
#
#   API_URL=http://host.docker.internal:8000/api/v1 docker compose up --build
#
# NOTE: the backend has no CORS middleware. A cross-origin API_URL (anything
# other than same-origin with wherever this container is served from) will
# be blocked by the browser unless you add CORS to the backend or put both
# services behind one reverse-proxy origin.
services:
  frontend:
    build: .
    ports:
      - "8080:80"
    environment:
      API_URL: ${API_URL:-http://host.docker.internal:8000/api/v1}
