server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Same-origin proxy to the backend (entrypoint.sh templates __BACKEND_URL__
    # at container start — see its comment and src/config.ts). This is what
    # lets API_URL stay a relative "/api/v1" in production: the browser only
    # ever talks to this origin, so the backend never needs CORS headers.
    # `proxy_pass` with no path component forwards the request URI
    # unmodified, so the backend's own /api/v1/* routes are reached as-is.
    location /api/ {
        proxy_pass __BACKEND_URL__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
